<!DOCTYPE html>
<html>
<head>
  <title>Multi-Agent Support Assistant</title>

  <style>
    body {
      margin:0;
      background: linear-gradient(135deg,#0b0f1f,#121a2f,#1d2b4a);
      font-family: "Segoe UI", Arial, sans-serif;
      color:#e5e7eb;
    }

    .app {
      max-width: 900px;
      margin: 40px auto;
      padding: 10px;
    }

    .header {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .subtitle {
      opacity:.7;
      margin-bottom: 25px;
    }

    .panel {
      background:#020617;
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      padding:18px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,.55);
    }

    .row {
      display:flex;
      gap:10px;
      margin-bottom:10px;
    }

    input {
      flex:1;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.15);
      background:#020617;
      color:#fff;
      outline:none;
    }

    button {
      padding:12px 16px;
      border-radius:12px;
      border:none;
      cursor:pointer;
      font-weight:600;
      background:#4f46e5;
      color:#fff;
      transition:.2s;
    }

    button:hover {
      background:#6366f1;
      transform: translateY(-1px);
    }

    .section-title {
      margin-top:15px;
      margin-bottom:6px;
      font-size:13px;
      letter-spacing:.5px;
      opacity:.7;
      text-transform: uppercase;
    }

    .card {
      margin-top:8px;
      padding:14px 16px;
      border-radius:14px;
      background:#0b1224;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      line-height:1.5;
    }

    .tag {
      display:inline-block;
      padding:6px 10px;
      border-radius:10px;
      font-size:12px;
      font-weight:600;
      background:#111b33;
      border:1px solid rgba(255,255,255,.15);
      margin-bottom:4px;
    }

    .intent {
      background:#0f3626;
      border:1px solid #2dd4bf;
    }

    .agent {
      background:#2a1436;
      border:1px solid #d946ef;
    }

    .response {
      background:#0a0f25;
      border:1px solid rgba(255,255,255,.12);
    }

    .footer-note {
      opacity:.6;
      margin-top:12px;
      font-size:12px;
      text-align:right;
    }

    @media(max-width:700px){
      .row {flex-direction:column;}
      button {width:100%;}
    }
  </style>
</head>

<body>
<div class="app">

  <div class="header">🤖 Multi-Agent Support Assistant</div>
  <div class="subtitle">Intent-based routing • Domain AI Agents • Azure OpenAI</div>

  <div class="panel">

    <div class="row">
      <input id="question" placeholder="Ask something… e.g., Why was ₹500 extra charged in my bill?" />
      <button onclick="askAgent()">Ask</button>
    </div>

    <div id="output"></div>

    <div class="footer-note">
      Type your query — response is auto-classified and routed to the right agent
    </div>

  </div>

</div>


<script>
async function askAgent() {

  const query = document.getElementById("question").value.trim();
  const output = document.getElementById("output");

  if (!query){
    output.innerHTML = `<div class='card response'>Please enter a question.</div>`;
    return;
  }

  output.innerHTML = `<div class='card response'>⏳ Processing your request…</div>`;

  try {

    const res = await fetch("http://127.0.0.1:8000/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query })
    });

    const data = await res.json();

    output.innerHTML = `
      <div class='section-title'>Identified Intent</div>
      <div class='card intent'>
        ${data.intent_result}
      </div>

      <div class='section-title'>Routed to Agent</div>
      <div class='card agent'>
        ${data.domain_agent}
      </div>

      <div class='section-title'>Agent Response</div>
      <div class='card response'>
        ${data.response}
      </div>
    `;

  } catch(e){
    output.innerHTML =
      "<div class='card response'>❌ API connection failed — ensure FastAPI is running.</div>";
  }
}
</script>

</body>
</html>
