<!DOCTYPE html>
<html>
<head>
  <title>Student Analytics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      📊 Student Result Analyzer
    </div>

    <div class="card-body">
      <input id="query" class="form-control" placeholder="Ask a question">
      <button class="btn btn-success mt-3" onclick="analyze()">Analyze</button>

      <h5 class="mt-4">Answer</h5>
      <pre id="answer" class="bg-dark text-white p-3 rounded"></pre>

      <h5 class="mt-4">Averages</h5>
      <pre id="avg" class="bg-light p-2"></pre>

      <h5 class="mt-4">Pass / Fail</h5>
      <pre id="pf" class="bg-light p-2"></pre>

      <h5 class="mt-4">Chart</h5>
      <img id="chart" class="img-fluid border mt-2"/>
    </div>
  </div>
</div>

<script>
function analyze() {
  const q = document.getElementById("query").value;

  fetch(`http://127.0.0.1:8000/analyze?query=${encodeURIComponent(q)}`)
    .then(res => res.json())
    .then(data => {
      console.log(data); // 🔍 DEBUG

      // ✅ Correct bindings
      document.getElementById("answer").innerText = data.answer;
      document.getElementById("avg").innerText =
        JSON.stringify(data.averages, null, 2);
      document.getElementById("pf").innerText =
        JSON.stringify(data.pass_fail, null, 2);

      // ✅ Correct image binding
      document.getElementById("chart").src =
        "data:image/png;base64," + data.chart;
    })
    .catch(err => {
      document.getElementById("answer").innerText =
        "Error: " + err;
    });
}
</script>

</body>
</html>
