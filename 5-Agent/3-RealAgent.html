<!DOCTYPE html>
<html>
<head>
  <title>AI Teaching Agent</title>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <style>
    body {
      background:#0f172a;
      color:#e5e7eb;
    }
    .chat-box {
      height: 70vh;
      overflow-y: auto;
      padding: 12px;
      border-radius: 12px;
      background:#020617;
      border:1px solid #1e293b;
    }
    .msg-user { color:#0ea5e9; }
    .msg-bot  { color:#22c55e; }
    .msg-small { color:#94a3b8; font-size:12px; }
  </style>
</head>

<body>

<div class="container mt-4">

  <h3>🧠 AI Teaching Agent — Memory Chat</h3>
  <p class="text-secondary">
    The agent remembers past conversation in session.
  </p>

  <div id="chatBox" class="chat-box mb-3"></div>

  <div class="input-group">
    <input id="userInput" class="form-control"
           placeholder="Type your question...">
    <button class="btn btn-info" onclick="sendMessage()">Send</button>
  </div>

  <p id="status" class="msg-small mt-2"></p>
</div>


<script>

const API_URL = "http://127.0.0.1:8000/chat";

async function sendMessage() {

  const input = document.getElementById("userInput");
  const msg = input.value.trim();
  if (!msg) return;

  addMessage("You", msg, "msg-user");
  input.value = "";

  document.getElementById("status").innerText = "Thinking...";

  try {
    const res = await fetch(`${API_URL}?q=${encodeURIComponent(msg)}`);
    const data = await res.json();

    addMessage("Agent", data.answer, "msg-bot");
    document.getElementById("status").innerText =
      `Conversation memory size: ${data.memory_size}`;

  } catch {
    addMessage("System", "❌ Failed to reach API", "text-danger");
  }
}

function addMessage(sender, text, css) {
  const box = document.getElementById("chatBox");
  box.innerHTML += `
    <div class="${css}">
      <b>${sender}:</b> ${text}
    </div>
    <hr>
  `;
  box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
