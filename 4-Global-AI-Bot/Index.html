<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Chatbot</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #1d2671, #c33764);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
}

.chat-container {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 15px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    height: 85vh;
    overflow: hidden;
}

.chat-header {
    background: #0d6efd;
    color: #fff;
    padding: 14px;
    text-align: center;
    font-weight: 600;
}

.chat-body {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
    background: #f8f9fa;
}

.message {
    margin-bottom: 12px;
    display: flex;
    gap: 8px;
}

.message.user {
    justify-content: flex-end;
}

.message.user .bubble {
    background: #0d6efd;
    color: #fff;
    border-radius: 15px 15px 0 15px;
}

.message.bot .bubble {
    background: #e9ecef;
    color: #000;
    border-radius: 15px 15px 15px 0;
}

.bubble {
    padding: 10px 14px;
    max-width: 75%;
    white-space: pre-wrap;
    font-size: 14px;
}

.bot-img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
}

.chat-footer {
    padding: 10px;
    background: #fff;
    border-top: 1px solid #ddd;
}

.typing {
    font-style: italic;
    font-size: 13px;
    color: #777;
    margin-left: 40px;
}

/* Glitter Effect */
.glitter {
    position: fixed;
    width: 8px;
    height: 8px;
    background: gold;
    border-radius: 50%;
    animation: sparkle 0.8s linear forwards;
}

@keyframes sparkle {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0; transform: scale(3) translateY(-40px); }
}
</style>
</head>

<body>

<div class="chat-container">
    <div class="chat-header">
        🤖 AI Chatbot Assistant
    </div>

    <div class="chat-body" id="chatBody"></div>

    <div class="chat-footer">
        <div class="input-group">
            <input type="text" id="userInput" class="form-control" placeholder="Type your message..." />
            <button class="btn btn-primary" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
const chatBody = document.getElementById("chatBody");

function addMessage(text, sender) {
    const msgDiv = document.createElement("div");
    msgDiv.className = "message " + sender;

    if (sender === "bot") {
        const img = document.createElement("img");
        img.src = "https://cdn-icons-png.flaticon.com/512/4712/4712035.png";
        img.className = "bot-img";
        msgDiv.appendChild(img);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerText = text;
    msgDiv.appendChild(bubble);

    chatBody.appendChild(msgDiv);
    chatBody.scrollTop = chatBody.scrollHeight;
}

function showTyping() {
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.id = "typing";
    typing.innerText = "Bot is typing...";
    chatBody.appendChild(typing);
    chatBody.scrollTop = chatBody.scrollHeight;
}

function removeTyping() {
    const typing = document.getElementById("typing");
    if (typing) typing.remove();
}

function glitterEffect(x, y) {
    for (let i = 0; i < 12; i++) {
        const g = document.createElement("div");
        g.className = "glitter";
        g.style.left = x + Math.random() * 20 + "px";
        g.style.top = y + Math.random() * 20 + "px";
        document.body.appendChild(g);
        setTimeout(() => g.remove(), 800);
    }
}

async function sendMessage() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text) return;

    glitterEffect(window.innerWidth / 2, window.innerHeight - 50);

    addMessage(text, "user");
    input.value = "";

    showTyping();

    try {
        const res = await fetch(`https://bd359c466dc5.ngrok-free.app/ask?q=${encodeURIComponent(text)}`);
        const data = await res.json();

        removeTyping();
        addMessage(data.answer, "bot");
    } catch (err) {
        removeTyping();
        addMessage("⚠ Unable to connect to server", "bot");
    }
}
</script>

</body>
</html>
